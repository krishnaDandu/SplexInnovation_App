<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="SPLEX Innovation home">
      <img src="assets/img/Splex-Innovation-Logo.png" alt="SPLEX Innovation">
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation">
      <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen"></i>
    </button>

    <nav class="main-nav" [class.open]="menuOpen" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>

      <!-- <a class="nav-link" routerLink="/home" routerLinkActive="active-link">Home</a> -->

      <a routerLink="/aboutus" routerLinkActive="active">About</a>
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/contactus" routerLinkActive="active">Contact</a>
      <a class="nav-cta mobile-cta" routerLink="/contactus">Get Started</a>
    </nav>

    <a class="nav-cta desktop-cta" routerLink="/contactus">Get Started</a>
  </div>
</header>
